# Rookbot default configuration
# Generated by `rookbot daemon install`

# Unix domain socket for daemon-UI IPC
# daemon_socket_path = "~/.local/share/rookbot/rookbot.sock"

# Path to policy rules file
# policy_path = "~/.config/clawdefender/policy.toml"

# Path to audit log file
# audit_log_path = "~/.local/share/clawdefender/audit.jsonl"

[slm]
enabled = true
context_size = 2048

[mcp_server]
enabled = true
http_port = 3201

[guard_api]
enabled = true
port = 3202

[behavioral]
enabled = true
learning_period_hours = 48
anomaly_threshold = 0.7

[threat_intel]
enabled = true

[network_policy]
enabled = true
