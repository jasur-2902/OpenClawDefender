/* ── Design Tokens ─────────────────────────────────────────── */

  --radius-sm: 6px;
  --radius-md: 10px;

/* ── Reset & Base ──────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font-ui);
  background: var(--bg-0);
  color: var(--ink-0);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }
input, textarea, select { font-family: inherit; color: inherit; }
.mono { font-family: var(--font-mono); font-feature-settings: "ss02"; }
.tabular { font-variant-numeric: tabular-nums; }

/* ── Scrollbar ─────────────────────────────────────────────── */
.cd-scroll::-webkit-scrollbar { width: 10px; height: 10px; }
.cd-scroll::-webkit-scrollbar-track { background: transparent; }
.cd-scroll::-webkit-scrollbar-thumb {
  background: oklch(0 0 0 / 0.18); border-radius: 999px;
  border: 2px solid transparent; background-clip: padding-box;
}
[data-theme="dark"] .cd-scroll::-webkit-scrollbar-thumb { background: oklch(1 0 0 / 0.12); background-clip: padding-box; }

/* ── Animations ────────────────────────────────────────────── */
@keyframes cdPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.cd-pulse { animation: cdPulse 1.6s ease-in-out infinite; }

@keyframes cdPulseDot {
  0% { box-shadow: 0 0 0 0 currentColor; opacity: 1; }
  100% { box-shadow: 0 0 0 8px transparent; opacity: 0.3; }
}
.cd-pulse-dot::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  animation: cdPulseDot 1.6s ease-out infinite;
}

@keyframes cdSlideIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.cd-slide-in { animation: cdSlideIn 0.32s cubic-bezier(.2,.7,.2,1); }

@keyframes cdShimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
.cd-shimmer {
  background: linear-gradient(90deg, transparent, oklch(1 0 0 / 0.06), transparent);
  background-size: 200% 100%; animation: cdShimmer 2s linear infinite;
}
[data-theme="dark"] .cd-shimmer {
  background: linear-gradient(90deg, transparent, oklch(1 0 0 / 0.04), transparent);
  background-size: 200% 100%;
}

@keyframes cdBlink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
.cd-caret { display: inline-block; width: 8px; height: 1em; background: var(--accent); vertical-align: -2px; margin-left: 2px; animation: cdBlink 1s steps(1) infinite; }

@keyframes rookSlide {
  0% { transform: translateX(-100%); }
  50% { transform: translateX(calc(var(--board-w, 600px) - 100%)); }
  100% { transform: translateX(-100%); }
}
.rook-slide { animation: rookSlide 6s ease-in-out infinite; }

@keyframes cdSpin { to { transform: rotate(360deg); } }
.cd-spin { animation: cdSpin 0.9s linear infinite; }

/* ── Layout Shell ──────────────────────────────────────────── */
#root { height: 100%; display: grid; grid-template-columns: 220px 1fr; overflow: hidden; }
#root.collapsed { grid-template-columns: 60px 1fr; }

    bishop: <g><path d="M22.5 5c-2 0-3.5 1.5-3.5 3.5 0 1 .5 1.8 1.2 2.3-3 1.5-5 5-5 9.2 0 4 2 7 7.3 8 5.3-1 7.3-4 7.3-8 0-4.2-2-7.7-5-9.2.7-.5 1.2-1.3 1.2-2.3 0-2-1.5-3.5-3.5-3.5z"/><path d="M20.5 13h4v3h-4z" fill="var(--bg-1)" opacity="0.9"/><path d="M14 30c1.5-3 5-3 8.5-3s7 0 8.5 3M11 36h23v-3H11zM13 33v-3h19v3z"/></g>,
    queen: <g><circle cx="9" cy="13" r="2"/><circle cx="22.5" cy="11" r="2"/><circle cx="36" cy="13" r="2"/><circle cx="15" cy="9" r="2"/><circle cx="30" cy="9" r="2"/><path d="M9 15l4 11h19l4-11-6 4-3.5-7-4 7-4-7-3.5 7z"/><path d="M11 28h23v3H11zM12 31h21v3H12zM10 34h25v3H10z"/></g>,
  };
  return (
    <svg viewBox="0 0 45 45" width={size} height={size} fill="currentColor" style={{ display: "block", ...extraStyle }}>

};

const riskPiece = (risk) => ({ low: "pawn", medium: "knight", high: "queen" }[risk] || "pawn");
const riskColor = (risk) => ({ low: "var(--green)", medium: "var(--amber)", high: "var(--red)" }[risk] || "var(--ink-2)");

const Dot = ({ color = "var(--accent)", size = 8, pulse = false, style: s }) => (
  <span style={{ display: "inline-block", width: size, height: size, borderRadius: 999, background: color, position: "relative", ...s }} className={pulse ? "cd-pulse-dot" : ""}/>

const Badge = ({ children, color = "var(--ink-2)", mono = false, style: s }) => (
  <span style={{

    case "tools": return <svg {...p}><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>;
    case "settings": return <svg {...p}><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>;
    case "shield": return <svg {...p}><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>;
    case "search": return <svg {...p}><circle cx="11" cy="11" r="6"/><path d="M16 16l5 5"/></svg>;
    case "chevron": return <svg {...p}><path d="M9 6l6 6-6 6"/></svg>;
    case "x": return <svg {...p}><path d="M5 5l14 14M19 5L5 19"/></svg>;
    case "check": return <svg {...p}><path d="M5 12l5 5 9-11"/></svg>;
    case "play": return <svg {...p}><path d="M6 4l13 8-13 8z" fill={color}/></svg>;
    case "pause": return <svg {...p}><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>;
    case "filter": return <svg {...p}><path d="M3 5h18l-7 9v6l-4-2v-4z"/></svg>;
    case "refresh": return <svg {...p}><path d="M4 12a8 8 0 0114-5l3 3M3 17l3-3a8 8 0 0014-5"/></svg>;
    case "lock": return <svg {...p}><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>;
    case "key": return <svg {...p}><circle cx="8" cy="15" r="3"/><path d="M11 13l9-9M16 8l3 3"/></svg>;
    case "network": return <svg {...p}><circle cx="12" cy="6" r="2.5"/><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M12 8.5l-7 7M12 8.5l7 7"/></svg>;
    case "grid": return <svg {...p}><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>;
    case "list": return <svg {...p}><path d="M3 6h18M3 12h18M3 18h18"/></svg>;
    case "clock": return <svg {...p}><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>;
    case "sidebar": return <svg {...p}><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>;
    case "audit": return <svg {...p}><path d="M5 3h11l4 4v14H5z"/><path d="M9 12h7M9 16h7M9 8h4"/></svg>;
    case "sandbox": return <svg {...p}><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M12 8V5M8 5h8"/></svg>;
    case "ban": return <svg {...p}><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>;
    case "sun": return <svg {...p}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>;
    case "moon": return <svg {...p}><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>;
    default: return <svg {...p}><circle cx="12" cy="12" r="3"/></svg>;

const Sparkline = ({ data, color = "var(--accent)", width = 120, height = 32 }) => {
  const max = Math.max(...data, 1);
  const step = width / (data.length - 1);
  const pts = data.map((v, i) => [i * step, height - (v / max) * (height - 4) - 2]);
  const d = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ");
  return (
    <svg width={width} height={height} style={{ display: "block" }}>
      <path d={`${d} L${width} ${height} L0 ${height} Z`} fill={color} opacity="0.12"/>
      <path d={d} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
};

const Btn = ({ children, kind = "ghost", size = "md", icon, onClick, style: s, disabled }) => {
  const sizes = { sm: { p: "5px 10px", fs: 12, r: 6 }, md: { p: "7px 14px", fs: 13, r: 7 }, lg: { p: "10px 18px", fs: 14, r: 8 } };
  const sz = sizes[size];
  const kinds = {
    primary: { bg: "var(--accent)", c: "white", b: "var(--accent)" },
    ghost: { bg: "transparent", c: "var(--ink-1)", b: "transparent" },
    soft: { bg: "var(--bg-2)", c: "var(--ink-0)", b: "var(--line)" },
    danger: { bg: "var(--red)", c: "white", b: "var(--red)" },
    accent: { bg: "var(--accent-soft)", c: "var(--accent)", b: "transparent" },
  };
  const k = kinds[kind];
  return (
    <button onClick={onClick} disabled={disabled} style={{
      display: "inline-flex", alignItems: "center", gap: 6,
      padding: sz.p, fontSize: sz.fs, fontWeight: 500,
      background: k.bg, color: k.c, border: `1px solid ${k.b}`,
      borderRadius: sz.r, opacity: disabled ? 0.4 : 1,
      cursor: disabled ? "not-allowed" : "pointer", ...s,
    }}>
      {icon && <Icon name={icon} size={13.5}/>}
      {children}
    </button>
  );
};

// RISK ICON — controlled by tweak

const RiskIcon = ({ risk, style: iconStyle, size = 26, tweaks }) => {
  const c = riskColor(risk);
  if (tweaks.riskIconStyle === "dots") {
    const sz = { low: 8, medium: 10, high: 12 }[risk] || 8;
    return <Dot color={c} size={sz} pulse={risk === "high"} style={iconStyle}/>;
  }
  if (tweaks.riskIconStyle === "bars") {
    const bars = { low: 1, medium: 2, high: 3 }[risk] || 1;
    return (
      <div style={{ display: "flex", alignItems: "flex-end", gap: 2, height: size, ...iconStyle }}>
        {[1,2,3].map(i => (
          <div key={i} style={{
            width: 4, borderRadius: 2,
            height: `${(i / 3) * 100}%`,
            background: i <= bars ? c : "var(--bg-3)",
          }}/>
        ))}
      </div>
    );
  }
  // Default: chess pieces
  return (
    <div style={{ color: c, ...iconStyle }}>
      <ChessPiece kind={riskPiece(risk)} size={size}/>
    </div>
  );
};

const ToolsPage = ({ tweaks, onSelectTool, selectedTool }) => {
  const [search, setSearch] = React.useState("");
  const [riskFilter, setRiskFilter] = React.useState("all");
  const [vendorFilter, setVendorFilter] = React.useState("all");

  const vendors = ["all", ...new Set(TOOLS.map(t => t.vendor))];
  const filtered = TOOLS.filter(t => {
    if (riskFilter !== "all" && t.risk !== riskFilter) return false;
    if (vendorFilter !== "all" && t.vendor !== vendorFilter) return false;
    if (search) {
      const s = search.toLowerCase();
      return t.name.toLowerCase().includes(s) || t.vendor.toLowerCase().includes(s) || t.id.toLowerCase().includes(s);
    }
    return true;
  });

  const isCard = tweaks.toolDensity === "card";

  return (
    <div style={{ display: "grid", gridTemplateColumns: selectedTool ? "1fr 380px" : "1fr", height: "100%", overflow: "hidden" }}>
      <div className="cd-scroll" style={{ padding: 24, overflowY: "auto" }}>
        <div style={{ maxWidth: 1080, margin: "0 auto" }}>
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 8 }}>
            <SectionTitle sub="Every MCP server, CLI tool, and AI agent connected to this machine.">Tools</SectionTitle>
          </div>

          {/* Toolbar */}
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
            <div style={{ position: "relative", flex: "0 0 220px" }}>
              <Icon name="search" size={13} color="var(--ink-3)" style={{ position: "absolute", left: 9, top: 8 }}/>
              <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search tools..."

            <div style={{ marginLeft: "auto", display: "flex", gap: 2 }}>
              <button onClick={() => {}} title="List view" style={{
                padding: 6, borderRadius: 5,
                background: !isCard ? "var(--accent-soft)" : "transparent",
                color: !isCard ? "var(--accent)" : "var(--ink-3)",
              }}><Icon name="list" size={14}/></button>
              <button onClick={() => {}} title="Card view" style={{
                padding: 6, borderRadius: 5,
                background: isCard ? "var(--accent-soft)" : "transparent",
                color: isCard ? "var(--accent)" : "var(--ink-3)",
              }}><Icon name="grid" size={14}/></button>
            </div>
          </div>

          {/* Summary */}
          <div style={{
            padding: "10px 16px", marginBottom: 16, borderRadius: 10,
            background: "color-mix(in oklch, var(--green) 8%, var(--bg-1))",

            fontSize: 13, color: "var(--ink-1)", display: "flex", alignItems: "center", gap: 8,
          }}>
            <Icon name="shield" size={15} color="var(--green)"/>
            <span>
              <strong>{TOOLS.length}</strong> tools detected &middot; <strong>{TOOLS.filter(t => t.wrapped).length}</strong> wrapped &middot; <strong style={{ color: "var(--red)" }}>{TOOLS.filter(t => !t.wrapped).length}</strong> exposed
            </span>
          </div>

          {/* Tool list/grid */}
          {isCard ? (
            <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 12 }}>
              {filtered.map(tool => <ToolCard key={tool.id} tool={tool} tweaks={tweaks} selected={selectedTool?.id === tool.id} onSelect={() => onSelectTool(tool)}/>)}

          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {filtered.map(tool => <ToolRow key={tool.id} tool={tool} tweaks={tweaks} selected={selectedTool?.id === tool.id} onSelect={() => onSelectTool(tool)}/>)}

  );
};

      <div style={{ padding: "16px 18px", borderBottom: "1px solid var(--line)", display: "flex", alignItems: "center", gap: 12 }}>
        <div style={{ width: 36, height: 36, borderRadius: 9, background: "var(--bg-2)", border: "1px solid var(--line)", display: "grid", placeItems: "center" }}>
          <RiskIcon risk={tool.risk} tweaks={tweaks} size={20}/>
        </div>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 14, fontWeight: 600 }}>{tool.name}</div>
          <div style={{ fontSize: 11, fontFamily: "var(--font-mono)", color: "var(--ink-3)" }}>{tool.vendor} &middot; v{tool.version}</div>
        </div>
        <button onClick={onClose} style={{ padding: 4, borderRadius: 5, color: "var(--ink-2)" }}
          onMouseEnter={e => e.currentTarget.style.background = "var(--bg-2)"}
          onMouseLeave={e => e.currentTarget.style.background = "transparent"}
        ><Icon name="x" size={14}/></button>
      </div>

      <div className="cd-scroll" style={{ flex: 1, overflowY: "auto", padding: 18, display: "grid", alignContent: "start", gap: 14 }}>
        {/* Identity */}
        <Card title="Identity">
          <KV k="Install date" v={new Date(tool.installDate).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })} mono/>
          <KV k="Auth method" v={tool.authMethod} mono/>
          <KV k="Trust level" v={tool.trust}/>
          <KV k="Anomaly score" v={tool.anomalyScore.toFixed(2)} mono/>
          <KV k="Last active" v={fmtRelative(tool.lastUsed)} mono/>
        </Card>

        {/* Permissions */}
        <Card title="Permission scope">
          <div style={{ display: "grid", gap: 10 }}>
            <PermBlock label="Filesystem" items={tool.permissions.filesystem}/>
            <PermBlock label="Network" items={tool.permissions.network}/>
            {tool.permissions.env.length > 0 && <PermBlock label="Env vars" items={tool.permissions.env}/>}
            <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12 }}>
              <span style={{ color: "var(--ink-2)" }}>Shell access</span>
              <span style={{ marginLeft: "auto", fontFamily: "var(--font-mono)", color: tool.permissions.shell ? "var(--red)" : "var(--green)" }}>
                {tool.permissions.shell ? "granted" : "denied"}
              </span>
            </div>
          </div>
        </Card>

        {/* MCP Servers */}
        {tool.mcpServers.length > 0 && (
          <Card title={`MCP Servers (${tool.mcpServers.length})`} padded={false}>
            {tool.mcpServers.map((srv, i) => (
              <div key={srv.name} style={{
                padding: "10px 16px", display: "flex", alignItems: "center", gap: 8,
                borderBottom: i < tool.mcpServers.length - 1 ? "1px solid var(--line-soft)" : "none",
                fontSize: 12, fontFamily: "var(--font-mono)",
              }}>
                <Dot color={srv.status === "running" ? "var(--green)" : "var(--ink-3)"} size={6}/>
                <span style={{ flex: 1, color: "var(--ink-1)" }}>{srv.name}</span>
                <span style={{ color: "var(--ink-3)" }}>{srv.calls} calls</span>
              </div>
            ))}
          </Card>
        )}

        {/* Recent moves */}
        <Card title="Recent moves" padded={false}>
          {tool.recentMoves.map((m, i) => (
            <div key={i} style={{
              padding: "8px 16px", display: "flex", alignItems: "center", gap: 8,
              borderBottom: i < tool.recentMoves.length - 1 ? "1px solid var(--line-soft)" : "none",
              fontSize: 11.5,
            }}>
              <span style={{ fontFamily: "var(--font-mono)", color: "var(--ink-3)", width: 50 }}>{m.t}</span>
              <span className="mono" style={{ color: "var(--accent)", width: 32, fontSize: 10.5, fontWeight: 600 }}>{m.notation}</span>
              <span className="mono" style={{ color: "var(--ink-1)", flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                {m.action} {m.target}
              </span>
              <VerdictPill verdict={m.verdict}/>
            </div>
          ))}
        </Card>

        {/* Actions */}
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <Btn kind="soft" size="sm" icon="pause">Pause</Btn>
          <Btn kind="soft" size="sm" icon="sandbox">Sandbox</Btn>
          <Btn kind="danger" size="sm" icon="ban">Revoke</Btn>
          <Btn kind="accent" size="sm" icon="audit">Audit log</Btn>
        </div>
      </div>
    </aside>
  );
};

const PermBlock = ({ label, items }) => (
  <div>
    <div style={{ fontSize: 11, color: "var(--ink-3)", marginBottom: 4 }}>{label}</div>
    <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
      {items.map(p => (
        <span key={p} className="mono" style={{
          fontSize: 10.5, padding: "3px 7px", borderRadius: 4,
          background: "var(--bg-2)", color: "var(--ink-1)",
          border: "1px solid var(--line-soft)",
        }}>{p}</span>
      ))}
    </div>
  </div>
);

// SCANS PAGE
// ═══════════════════════════════════════════════════════════════

const ScansPage = ({ tweaks }) => {
  const [sevFilter, setSevFilter] = React.useState("all");
  const [scopeFilter, setScopeFilter] = React.useState("all");
  const [expanded, setExpanded] = React.useState(null);
  const [showScopePicker, setShowScopePicker] = React.useState(false);

  const liveScan = SCANS.find(s => s.status === "running");
  const pastScans = SCANS.filter(s => s.status !== "running");

  const scopes = ["all", ...new Set(SCANS.map(s => s.scope))];
  const filteredPast = pastScans.filter(s => {
    if (scopeFilter !== "all" && s.scope !== scopeFilter) return false;
    if (sevFilter !== "all") {
      if (sevFilter === "critical" && s.threatsFound < 3) return false;
      if (sevFilter === "clean" && s.threatsFound > 0) return false;
    }
    return true;
  });

  const isVertical = tweaks.timelineOrientation === "vertical";

  return (
    <div className="cd-scroll" style={{ padding: 24, overflowY: "auto", height: "100%" }}>
      <div style={{ maxWidth: 1080, margin: "0 auto" }}>
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 8 }}>
          <SectionTitle sub="Security scans Rookbot has run on your tools and system.">Scans</SectionTitle>
          <div style={{ position: "relative" }}>
            <Btn kind="primary" size="md" icon="scan" onClick={() => setShowScopePicker(!showScopePicker)}>Run scan</Btn>
            {showScopePicker && <ScopePicker onClose={() => setShowScopePicker(false)}/>}
          </div>
        </div>

        {/* Live scan banner */}
        {liveScan && <LiveScanBanner scan={liveScan}/>}

        {/* Filters */}
        <div style={{ display: "flex", gap: 8, marginBottom: 16, alignItems: "center" }}>
          <FilterPill label="severity" value={sevFilter} options={["all","critical","clean"]} onChange={setSevFilter}/>
          <FilterPill label="scope" value={scopeFilter} options={scopes} onChange={setScopeFilter}/>
          <span style={{ marginLeft: "auto", fontSize: 12, color: "var(--ink-3)" }}>
            {filteredPast.length} past scan{filteredPast.length !== 1 ? "s" : ""}
          </span>
        </div>

        {/* Timeline */}
        {isVertical ? (
          <VerticalTimeline scans={filteredPast} expanded={expanded} setExpanded={setExpanded}/>
        ) : (
          <HorizontalTimeline scans={filteredPast} expanded={expanded} setExpanded={setExpanded}/>
        )}
      </div>
    </div>
  );
};

const LiveScanBanner = ({ scan }) => (
  <div className="cd-slide-in" style={{
    padding: "14px 18px", marginBottom: 18, borderRadius: 12,
    background: "var(--bg-1)", border: "1px solid var(--accent-line)",
    position: "relative", overflow: "hidden",
  }}>
    <div className="cd-shimmer" style={{ position: "absolute", inset: 0 }}/>
    <div style={{ position: "relative", zIndex: 1 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 10 }}>
        {/* Animated rook sliding along a board strip */}
        <div style={{
          width: 180, height: 28, borderRadius: 6, overflow: "hidden",
          background: "var(--bg-2)", border: "1px solid var(--line)", position: "relative",
          display: "flex",
        }}>
          {Array.from({ length: 8 }).map((_, i) => (
            <div key={i} style={{
              flex: 1, background: i % 2 === 0 ? "var(--bg-2)" : "color-mix(in oklch, var(--ink-3) 8%, var(--bg-2))",
            }}/>
          ))}
          <div className="rook-slide" style={{ position: "absolute", top: 2, left: 0, "--board-w": "160px" }}>
            <Rook size={24} color="var(--accent)"/>
          </div>
        </div>
        <div style={{ flex: 1 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontSize: 14, fontWeight: 600 }}>Scan in progress</span>
            <Badge color="var(--accent)" mono><span className="cd-pulse">live</span></Badge>
          </div>
          <div style={{ fontSize: 11.5, color: "var(--ink-2)", fontFamily: "var(--font-mono)", marginTop: 2 }}>
            {scan.scope} &middot; Stage: {scan.currentStage} &middot; {scan.threatsFound} finding{scan.threatsFound !== 1 ? "s" : ""} so far
          </div>
        </div>
        <Btn kind="ghost" icon="x" size="sm">Stop</Btn>
      </div>
      {/* Progress bar */}
      <div style={{ height: 4, background: "var(--bg-3)", borderRadius: 2, overflow: "hidden" }}>
        <div style={{ width: `${scan.progress}%`, height: "100%", background: "var(--accent)", transition: "width 0.5s ease" }}/>
      </div>
      {/* Stage chips */}
      <div style={{ display: "flex", gap: 6, marginTop: 10 }}>
        {scan.stages.map((s, i) => (
          <div key={i} style={{
            flex: 1, padding: "6px 8px", borderRadius: 6, fontSize: 10.5, fontWeight: 500,
            background: s.status === "running" ? "var(--accent-soft)" : s.status === "done" ? "var(--green-soft)" : "var(--bg-2)",
            color: s.status === "running" ? "var(--accent)" : s.status === "done" ? "var(--green)" : "var(--ink-3)",
            border: `1px solid ${s.status === "running" ? "var(--accent-line)" : s.status === "done" ? "color-mix(in oklch, var(--green) 30%, transparent)" : "var(--line-soft)"}`,
            display: "flex", alignItems: "center", gap: 4,
          }}>
            {s.status === "done" && <Icon name="check" size={10} color="var(--green)"/>}
            {s.status === "running" && <span className="cd-spin" style={{ width: 10, height: 10, border: "1.5px solid var(--accent)", borderTopColor: "transparent", borderRadius: 999, display: "inline-block" }}/>}
            {s.name}
          </div>
        ))}
      </div>
    </div>
  </div>
);

const ScopePicker = ({ onClose }) => (
  <>
    <div onClick={onClose} style={{ position: "fixed", inset: 0, zIndex: 50 }}/>
    <div className="cd-slide-in" style={{
      position: "absolute", top: "100%", right: 0, marginTop: 6, width: 260,
      background: "var(--bg-1)", border: "1px solid var(--line)", borderRadius: 10,
      boxShadow: "var(--shadow-lg)", zIndex: 60, overflow: "hidden",
    }}>
      <div style={{ padding: "10px 14px", fontSize: 12, fontWeight: 600, color: "var(--ink-1)", borderBottom: "1px solid var(--line-soft)" }}>Scan scope</div>
      {[
        { label: "Full system", desc: "All tools, configs, network posture", icon: "shield" },
        { label: "All MCP servers", desc: "Every connected MCP server", icon: "tools" },
        { label: "Specific tool...", desc: "Pick a single tool to audit", icon: "scan" },
      ].map((opt, i) => (
        <button key={i} onClick={onClose} style={{
          width: "100%", padding: "10px 14px", display: "flex", alignItems: "center", gap: 10,
          textAlign: "left", fontSize: 12.5, borderBottom: i < 2 ? "1px solid var(--line-soft)" : "none",
        }}
          onMouseEnter={e => e.currentTarget.style.background = "var(--accent-soft)"}
          onMouseLeave={e => e.currentTarget.style.background = "transparent"}
        >
          <Icon name={opt.icon} size={14} color="var(--ink-2)"/>
          <div>
            <div style={{ fontWeight: 500, color: "var(--ink-0)" }}>{opt.label}</div>
            <div style={{ fontSize: 11, color: "var(--ink-3)", marginTop: 1 }}>{opt.desc}</div>
          </div>
        </button>
      ))}
    </div>
  </>
);

const VerticalTimeline = ({ scans, expanded, setExpanded }) => (
  <div style={{ display: "grid", gap: 12 }}>
    {scans.map(scan => (
      <ScanRow key={scan.id} scan={scan} isExpanded={expanded === scan.id} onToggle={() => setExpanded(expanded === scan.id ? null : scan.id)}/>
    ))}
  </div>
);

const HorizontalTimeline = ({ scans, expanded, setExpanded }) => (
  <div>
    <div style={{ display: "flex", gap: 12, overflowX: "auto", paddingBottom: 8 }} className="cd-scroll">
      {scans.map(scan => (
        <div key={scan.id} style={{ flex: "0 0 280px" }}>
          <ScanCard scan={scan} isExpanded={expanded === scan.id} onToggle={() => setExpanded(expanded === scan.id ? null : scan.id)}/>
        </div>
      ))}
    </div>
    {expanded && (
      <div className="cd-slide-in" style={{ marginTop: 12 }}>
        <ScanMoves scan={scans.find(s => s.id === expanded)}/>
      </div>
    )}
  </div>
);

const ScanRow = ({ scan, isExpanded, onToggle }) => {
  const d = new Date(scan.startedAt);
  const threatColor = scan.threatsFound === 0 ? "var(--green)" : scan.threatsFound >= 3 ? "var(--red)" : "var(--amber)";
  return (
    <div style={{ background: "var(--bg-1)", border: `1px solid ${isExpanded ? "var(--accent-line)" : "var(--line)"}`, borderRadius: 10, overflow: "hidden" }}>
      <button onClick={onToggle} style={{
        width: "100%", padding: "14px 16px", display: "flex", alignItems: "center", gap: 14,
        textAlign: "left", cursor: "pointer",
      }}
        onMouseEnter={e => !isExpanded && (e.currentTarget.style.background = "var(--accent-soft)")}
        onMouseLeave={e => (e.currentTarget.style.background = "transparent")}
      >
        <div style={{
          width: 32, height: 32, borderRadius: 8,
          background: scan.type === "ai" ? "var(--violet-soft)" : "var(--bg-2)",
          border: `1px solid ${scan.type === "ai" ? "color-mix(in oklch, var(--violet) 30%, transparent)" : "var(--line)"}`,
          display: "grid", placeItems: "center", flexShrink: 0,
        }}>
          <Icon name="scan" size={14} color={scan.type === "ai" ? "var(--violet)" : "var(--ink-2)"}/>
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 2 }}>
            <span style={{ fontSize: 13, fontWeight: 600 }}>{scan.scope}</span>
            <Badge color={scan.type === "ai" ? "var(--violet)" : "var(--ink-2)"} mono>{scan.type === "ai" ? "deep" : "quick"}</Badge>
          </div>
          <div style={{ fontSize: 11, fontFamily: "var(--font-mono)", color: "var(--ink-3)" }}>
            {fmtDate(scan.startedAt)} &middot; {scan.duration ? `${scan.duration}s` : "in progress"}
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 12, flexShrink: 0 }}>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: 16, fontWeight: 600, fontFamily: "var(--font-mono)", color: threatColor }}>{scan.threatsFound}</div>
            <div style={{ fontSize: 10, color: "var(--ink-3)" }}>findings</div>
          </div>
          <Icon name="chevron" size={13} color="var(--ink-3)" style={{ transform: isExpanded ? "rotate(90deg)" : "none", transition: "transform 0.15s" }}/>
        </div>
      </button>
      {isExpanded && (
        <div className="cd-slide-in" style={{ borderTop: "1px solid var(--line-soft)" }}>
          <ScanMoves scan={scan}/>
        </div>
      )}
    </div>
  );
};

const ScanCard = ({ scan, isExpanded, onToggle }) => {
  const threatColor = scan.threatsFound === 0 ? "var(--green)" : scan.threatsFound >= 3 ? "var(--red)" : "var(--amber)";
  return (
    <button onClick={onToggle} style={{
      width: "100%", textAlign: "left", padding: 16,
      background: isExpanded ? "var(--accent-soft)" : "var(--bg-1)",
      border: `1px solid ${isExpanded ? "var(--accent-line)" : "var(--line)"}`,
      borderRadius: 10, cursor: "pointer",
    }}
      onMouseEnter={e => !isExpanded && (e.currentTarget.style.borderColor = "var(--line-strong)")}
      onMouseLeave={e => !isExpanded && (e.currentTarget.style.borderColor = "var(--line)")}
    >
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <Badge color={scan.type === "ai" ? "var(--violet)" : "var(--ink-2)"} mono>{scan.type === "ai" ? "deep" : "quick"}</Badge>
        <span style={{ fontSize: 11, fontFamily: "var(--font-mono)", color: "var(--ink-3)" }}>{fmtDate(scan.startedAt)}</span>
      </div>
      <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 4 }}>{scan.scope}</div>
      <div style={{ fontSize: 11, fontFamily: "var(--font-mono)", color: "var(--ink-3)", marginBottom: 10 }}>
        {scan.duration}s &middot; {scan.stages.length} stages
      </div>
      <div style={{ display: "flex", alignItems: "baseline", gap: 6 }}>
        <span style={{ fontSize: 22, fontWeight: 700, fontFamily: "var(--font-mono)", color: threatColor }}>{scan.threatsFound}</span>
        <span style={{ fontSize: 12, color: "var(--ink-2)" }}>finding{scan.threatsFound !== 1 ? "s" : ""}</span>
      </div>
    </button>
  );
};

const ScanMoves = ({ scan }) => {
  if (!scan) return null;
  return (
    <div style={{ padding: "12px 16px" }}>
      <div style={{ fontSize: 11, fontWeight: 600, color: "var(--ink-2)", textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 10 }}>
        Move log
      </div>
      <div style={{ display: "grid", gap: 6 }}>
        {scan.moves.map((m, i) => (
          <div key={i} style={{
            display: "flex", alignItems: "flex-start", gap: 10, padding: "6px 10px",
            background: m.type === "threat" ? "var(--red-soft)" : "var(--bg-2)",
            borderRadius: 6,
            border: m.type === "threat" ? "1px solid color-mix(in oklch, var(--red) 20%, transparent)" : "1px solid transparent",
          }}>
            <span className="mono" style={{ color: "var(--ink-3)", fontSize: 10.5, width: 38, flexShrink: 0 }}>{m.t}</span>
            <span className="mono" style={{
              color: m.type === "threat" ? "var(--red)" : m.type === "tool" ? "var(--accent)" : "var(--ink-3)",
              fontSize: 10.5, width: 48, flexShrink: 0, fontWeight: 600,
            }}>
              {m.type === "threat" ? "THREAT" : m.type === "tool" ? "EVAL" : "MOVE"}
            </span>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 12, color: "var(--ink-0)" }}>{m.desc}</div>
              {m.response && (
                <div style={{ fontSize: 11, fontFamily: "var(--font-mono)", color: "var(--green)", marginTop: 2 }}>
                  Response: {m.response}
                </div>
              )}
            </div>
            <span className="mono" style={{ color: "var(--ink-3)", fontSize: 10, flexShrink: 0 }}>{m.notation}</span>
          </div>
        ))}
      </div>
    </div>
  );
};

  return (
    <header style={{
      height: 44, minHeight: 44, background: "var(--bg-0)",
      borderBottom: "1px solid var(--line)",
      display: "flex", alignItems: "center", padding: "0 20px", gap: 12,
    }}>
      <div style={{ flex: 1, fontSize: 13.5, fontWeight: 600, color: "var(--ink-0)" }}>{titleMap[current] || ""}</div>
      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
        <kbd style={{ fontSize: 10, color: "var(--ink-3)", padding: "2px 6px", borderRadius: 4, background: "var(--bg-2)", border: "1px solid var(--line)", fontFamily: "var(--font-ui)" }}>
          /
        </kbd>
        <span style={{ fontSize: 11, color: "var(--ink-3)" }}>search</span>
      </div>
    </header>
  );
};

// ═══════════════════════════════════════════════════════════════
// TWEAKS PANEL
// ═══════════════════════════════════════════════════════════════

const TweaksPanel = ({ tweaks, setTweak }) => {
  const [open, setOpen] = React.useState(true);

  return open ? (
    <div style={{
      position: "fixed", right: 16, bottom: 16, zIndex: 999, width: 260,
      background: "color-mix(in oklch, var(--bg-1) 90%, transparent)",
      backdropFilter: "blur(20px)", WebkitBackdropFilter: "blur(20px)",
      border: "1px solid var(--line)", borderRadius: 14,
      boxShadow: "var(--shadow-lg)", overflow: "hidden",
      fontSize: 11.5,
    }}>
      <div style={{ padding: "10px 14px", display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: "1px solid var(--line-soft)" }}>
        <strong style={{ fontSize: 12 }}>Tweaks</strong>
        <button onClick={() => setOpen(false)} style={{ color: "var(--ink-3)", fontSize: 13 }}>x</button>
      </div>
      <div style={{ padding: 14, display: "grid", gap: 12 }}>
        <TweakLabel label="Risk icon style">
          <TweakSeg value={tweaks.riskIconStyle} options={["pieces","dots","bars"]} onChange={v => setTweak("riskIconStyle", v)}/>
        </TweakLabel>
        <TweakLabel label="Tools density">
          <TweakSeg value={tweaks.toolDensity} options={["list","card"]} onChange={v => setTweak("toolDensity", v)}/>
        </TweakLabel>
        <TweakLabel label="Scans timeline">
          <TweakSeg value={tweaks.timelineOrientation} options={["vertical","horizontal"]} onChange={v => setTweak("timelineOrientation", v)}/>
        </TweakLabel>
      </div>
    </div>
  ) : (
    <button onClick={() => setOpen(true)} style={{
      position: "fixed", right: 16, bottom: 16, zIndex: 999,
      width: 36, height: 36, borderRadius: 10,
      background: "var(--bg-1)", border: "1px solid var(--line)",
      boxShadow: "var(--shadow-md)", display: "grid", placeItems: "center",
      color: "var(--ink-2)",
    }}>
      <Icon name="settings" size={16}/>
    </button>
  );
};

const TweakLabel = ({ label, children }) => (
  <div>
    <div style={{ fontSize: 10, fontWeight: 600, color: "var(--ink-3)", textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 5 }}>{label}</div>
    {children}
  </div>
);

const TweakSeg = ({ value, options, onChange }) => {
  const idx = options.indexOf(value);
  const n = options.length;
  return (
    <div style={{ position: "relative", display: "flex", padding: 2, borderRadius: 7, background: "var(--bg-3)" }}>
      <div style={{
        position: "absolute", top: 2, bottom: 2, borderRadius: 5,
        background: "var(--bg-1)", boxShadow: "var(--shadow-sm)",
        transition: "left 0.15s, width 0.15s",
        left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
        width: `calc((100% - 4px) / ${n})`,
      }}/>
      {options.map(o => (
        <button key={o} onClick={() => onChange(o)} style={{
          flex: 1, position: "relative", zIndex: 1, height: 22,
          fontSize: 10.5, fontWeight: 500, color: o === value ? "var(--ink-0)" : "var(--ink-3)",
          borderRadius: 5,
        }}>{o}</button>
      ))}
    </div>
  );
};

// ═══════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════

function fmtRelative(iso) {
  const d = new Date(iso);
  const now = new Date("2026-05-03T14:35:00Z"); // frozen "now" for prototype
  const diffMs = now - d;
  const mins = Math.floor(diffMs / 60000);
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  return `${days}d ago`;
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" }) + " " +
    d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
}

// ═══════════════════════════════════════════════════════════════
// APP
// ═══════════════════════════════════════════════════════════════

const App = () => {
  const [page, setPage] = React.useState("tools");
  const [collapsed, setCollapsed] = React.useState(false);
  const [dark, setDark] = React.useState(false);
  const [selectedTool, setSelectedTool] = React.useState(null);
  const [tweaks, setTweaks] = React.useState({
    riskIconStyle: "pieces",
    toolDensity: "list",
    timelineOrientation: "vertical",
  });

  const setTweak = (k, v) => setTweaks(prev => ({ ...prev, [k]: v }));

  React.useEffect(() => {
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  }, [dark]);

  return (
    <div id="root" className={collapsed ? "collapsed" : ""} style={{ height: "100%", display: "grid", gridTemplateColumns: collapsed ? "60px 1fr" : "220px 1fr", overflow: "hidden" }}>
      <Sidebar current={page} onNav={(p) => { setPage(p); setSelectedTool(null); }} collapsed={collapsed} onToggle={() => setCollapsed(!collapsed)} dark={dark} onDark={() => setDark(!dark)}/>
      <div style={{ display: "grid", gridTemplateRows: "auto 1fr", overflow: "hidden" }}>
        <StatusHeader current={page}/>
        <main style={{ overflow: "hidden", position: "relative" }}>
          {page === "tools" && <ToolsPage tweaks={tweaks} onSelectTool={setSelectedTool} selectedTool={selectedTool}/>}
          {page === "scans" && <ScansPage tweaks={tweaks}/>}
        </main>
      </div>
      <TweaksPanel tweaks={tweaks} setTweak={setTweak}/>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
