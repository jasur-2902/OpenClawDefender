      #   env:
      #     CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      #     CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #   run: |
      #     echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
      #     security create-keychain -p "" build.keychain
      #     security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
      #     security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
      #     security default-keychain -s build.keychain

      # - name: Code sign with Developer ID
      #   run: |
      #     codesign --sign "Developer ID Application: ${{ secrets.APPLE_TEAM_NAME }}" \
      #       --options runtime \
      #       --timestamp \
      #       target/universal-apple-darwin/release/rookbot
      #     codesign --sign "Developer ID Application: ${{ secrets.APPLE_TEAM_NAME }}" \
      #       --options runtime \
      #       --timestamp \
      #       target/universal-apple-darwin/release/rookbot-daemon

      # - name: Notarize binaries
      #   run: |
      #     cd target/universal-apple-darwin/release
      #     zip rookbot.zip rookbot rookbot-daemon
      #     xcrun notarytool submit rookbot.zip \
      #       --apple-id "${{ secrets.APPLE_ID }}" \
      #       --password "${{ secrets.APPLE_APP_PASSWORD }}" \
