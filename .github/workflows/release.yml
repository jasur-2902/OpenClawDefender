name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Universal Binary
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-

      - name: Build aarch64
        run: |
          cargo build --release --target aarch64-apple-darwin --package clawdefender-cli
          cargo build --release --target aarch64-apple-darwin --package clawdefender-daemon

      - name: Build x86_64
        run: |
          cargo build --release --target x86_64-apple-darwin --package clawdefender-cli
          cargo build --release --target x86_64-apple-darwin --package clawdefender-daemon

      - name: Create universal binaries
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/rookbot \
            target/x86_64-apple-darwin/release/rookbot \
            -output target/universal-apple-darwin/release/rookbot
          lipo -create \
            target/aarch64-apple-darwin/release/rookbot-daemon \
            target/x86_64-apple-darwin/release/rookbot-daemon \
            -output target/universal-apple-darwin/release/rookbot-daemon

      - name: Ad-hoc code sign
        run: |
          codesign --sign - --force target/universal-apple-darwin/release/rookbot
          codesign --sign - --force target/universal-apple-darwin/release/rookbot-daemon

      - name: Create tarball and checksum
        run: |
          cd target/universal-apple-darwin/release
          tar czf rookbot-macos-universal.tar.gz rookbot rookbot-daemon
          shasum -a 256 rookbot-macos-universal.tar.gz > rookbot-macos-universal.tar.gz.sha256

      - name: Upload macOS artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/universal-apple-darwin/release/rookbot-macos-universal.tar.gz
            target/universal-apple-darwin/release/rookbot-macos-universal.tar.gz.sha256
          generate_release_notes: true

      # ------------------------------------------------------------------
