      #       --wait
      #     xcrun stapler staple rookbot
      #     xcrun stapler staple rookbot-daemon

  build-linux-x86:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-x86_64-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-release-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Build
        run: |
          cargo build --release -p clawdefender-cli
          cargo build --release -p clawdefender-daemon

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/rookbot dist/rookbot
          cp target/release/rookbot-daemon dist/rookbot-daemon
          cd dist
          tar czf rookbot-linux-x86_64.tar.gz rookbot rookbot-daemon
          sha256sum rookbot-linux-x86_64.tar.gz > rookbot-linux-x86_64.tar.gz.sha256

      - name: Upload Linux x86_64 artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: dist/rookbot-linux-x86_64.tar.gz*

  build-linux-arm:
    name: Build Linux aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-aarch64-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-aarch64-release-

      - name: Install cross
        run: cargo install cross --locked

      - name: Build with cross
        run: |
          cross build --release --target aarch64-unknown-linux-gnu -p clawdefender-cli
          cross build --release --target aarch64-unknown-linux-gnu -p clawdefender-daemon

      - name: Package
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/rookbot dist/rookbot
          cp target/aarch64-unknown-linux-gnu/release/rookbot-daemon dist/rookbot-daemon
          cd dist
          tar czf rookbot-linux-aarch64.tar.gz rookbot rookbot-daemon
          sha256sum rookbot-linux-aarch64.tar.gz > rookbot-linux-aarch64.tar.gz.sha256

      - name: Upload Linux aarch64 artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: dist/rookbot-linux-aarch64.tar.gz*

  publish-npm:
    name: Publish npm Package
    needs: [build-macos, build-linux-x86]
    # Note: build-linux-arm is not required — aarch64 is best-effort for now
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        run: |
          cd npm
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  update-homebrew:
    name: Update Homebrew Formula
    needs: [build-macos, build-linux-x86]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets and compute SHAs
        run: |
          VERSION="${GITHUB_REF_NAME}"
          BASE_URL="https://github.com/rookbot-io/rookbot/releases/download/${VERSION}"

          curl -fSL "${BASE_URL}/rookbot-macos-universal.tar.gz" -o "rookbot-macos-universal.tar.gz"
          curl -fSL "${BASE_URL}/rookbot-linux-x86_64.tar.gz" -o "rookbot-linux-x86_64.tar.gz"
          # aarch64 is best-effort — skip if not available
          curl -fSL "${BASE_URL}/rookbot-linux-aarch64.tar.gz" -o "rookbot-linux-aarch64.tar.gz" 2>/dev/null || true

          SHA_MACOS=$(sha256sum rookbot-macos-universal.tar.gz | awk '{print $1}')
          SHA_LINUX_X86=$(sha256sum rookbot-linux-x86_64.tar.gz | awk '{print $1}')
          if [ -f rookbot-linux-aarch64.tar.gz ]; then
            SHA_LINUX_ARM=$(sha256sum rookbot-linux-aarch64.tar.gz | awk '{print $1}')
          else
            SHA_LINUX_ARM="PLACEHOLDER"
          fi

          echo "SHA_MACOS=${SHA_MACOS}" >> "$GITHUB_ENV"
          echo "SHA_LINUX_X86=${SHA_LINUX_X86}" >> "$GITHUB_ENV"
          echo "SHA_LINUX_ARM=${SHA_LINUX_ARM}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Update formula and push to tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/rookbot-io/homebrew-tap.git" tap
          mkdir -p tap/Formula

          cat > tap/Formula/rookbot.rb << 'FORMULA'
          class Rookbot < Formula
            desc "A firewall for AI agents"
            homepage "https://github.com/rookbot-io/rookbot"
            version "VERSION_PLACEHOLDER"
            license all_of: ["Apache-2.0", "MIT"]

            on_macos do
              url "https://github.com/rookbot-io/rookbot/releases/download/v#{version}/rookbot-macos-universal.tar.gz"
              sha256 "SHA_MACOS_PLACEHOLDER"
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/rookbot-io/rookbot/releases/download/v#{version}/rookbot-linux-aarch64.tar.gz"
                sha256 "SHA_LINUX_ARM_PLACEHOLDER"
              else
                url "https://github.com/rookbot-io/rookbot/releases/download/v#{version}/rookbot-linux-x86_64.tar.gz"
                sha256 "SHA_LINUX_X86_PLACEHOLDER"
              end
            end

            def install
              bin.install "rookbot"
              bin.install "rookbot-daemon"
            end

            def post_install
              system bin/"rookbot", "init"
            end

            test do
              assert_match "rookbot", shell_output("#{bin}/rookbot version")
            end
          end
          FORMULA

          cd tap
          sed -i "s/VERSION_PLACEHOLDER/${RELEASE_VERSION}/" Formula/rookbot.rb
          sed -i "s/SHA_MACOS_PLACEHOLDER/${SHA_MACOS}/" Formula/rookbot.rb
          sed -i "s/SHA_LINUX_X86_PLACEHOLDER/${SHA_LINUX_X86}/" Formula/rookbot.rb
          sed -i "s/SHA_LINUX_ARM_PLACEHOLDER/${SHA_LINUX_ARM}/" Formula/rookbot.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/rookbot.rb
          git commit -m "Update rookbot to ${RELEASE_VERSION}"
          git push origin main
