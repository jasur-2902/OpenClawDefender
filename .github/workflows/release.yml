  build-linux:
    name: Build Linux Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-release-

      - name: Install native build dependencies (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install cross-compilation tools (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          # Add arm64 package sources from Ubuntu ports
          echo "deb [arch=arm64] http://ports.ubuntu.com/ $(lsb_release -cs) main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ $(lsb_release -cs)-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64-ports.list
          # Pin existing repos to amd64
          for f in /etc/apt/sources.list.d/*.list; do
            [ "$f" = "/etc/apt/sources.list.d/arm64-ports.list" ] && continue
            sudo sed -i '/^\s*deb\s/ { /\[.*arch=/ !s/deb /deb [arch=amd64] / }' "$f" 2>/dev/null || true
          done
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i '/^\s*deb\s/ { /\[.*arch=/ !s/deb /deb [arch=amd64] / }' /etc/apt/sources.list 2>/dev/null || true
          fi
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libssl-dev:arm64 pkg-config

      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }} -p clawdefender-cli
          cargo build --release --target ${{ matrix.target }} -p clawdefender-daemon
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '1' || '' }}
          OPENSSL_LIB_DIR: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '/usr/lib/aarch64-linux-gnu' || '' }}
          OPENSSL_INCLUDE_DIR: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '/usr/include' || '' }}

      - name: Package
        run: |
          ARCH=${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64' || 'x86_64' }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/rookbot dist/rookbot
          cp target/${{ matrix.target }}/release/rookbot-daemon dist/rookbot-daemon
          cd dist
          tar czf rookbot-linux-${ARCH}.tar.gz rookbot rookbot-daemon
          sha256sum rookbot-linux-${ARCH}.tar.gz > rookbot-linux-${ARCH}.tar.gz.sha256

      - name: Upload Linux artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rookbot-linux-*.tar.gz*

  publish-npm:
    name: Publish npm Package
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        run: |
          cd npm
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  update-homebrew:
    name: Update Homebrew Formula
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets and compute SHAs
        run: |
          VERSION="${GITHUB_REF_NAME}"
          BASE_URL="https://github.com/rookbot-io/rookbot/releases/download/${VERSION}"
          for ASSET in rookbot-macos-universal rookbot-linux-x86_64 rookbot-linux-aarch64; do
            curl -fSL "${BASE_URL}/${ASSET}.tar.gz" -o "${ASSET}.tar.gz"
          done

          SHA_MACOS=$(sha256sum rookbot-macos-universal.tar.gz | awk '{print $1}')
          SHA_LINUX_X86=$(sha256sum rookbot-linux-x86_64.tar.gz | awk '{print $1}')
          SHA_LINUX_ARM=$(sha256sum rookbot-linux-aarch64.tar.gz | awk '{print $1}')

          echo "SHA_MACOS=${SHA_MACOS}" >> "$GITHUB_ENV"
          echo "SHA_LINUX_X86=${SHA_LINUX_X86}" >> "$GITHUB_ENV"
          echo "SHA_LINUX_ARM=${SHA_LINUX_ARM}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Update formula and push to tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/rookbot-io/homebrew-tap.git" tap
          mkdir -p tap/Formula

          cat > tap/Formula/rookbot.rb << 'FORMULA'
          class Rookbot < Formula
            desc "A firewall for AI agents"
            homepage "https://github.com/rookbot-io/rookbot"
            version "VERSION_PLACEHOLDER"
            license all_of: ["Apache-2.0", "MIT"]

            on_macos do
              url "https://github.com/rookbot-io/rookbot/releases/download/v#{version}/rookbot-macos-universal.tar.gz"
              sha256 "SHA_MACOS_PLACEHOLDER"
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/rookbot-io/rookbot/releases/download/v#{version}/rookbot-linux-aarch64.tar.gz"
                sha256 "SHA_LINUX_ARM_PLACEHOLDER"
              else
                url "https://github.com/rookbot-io/rookbot/releases/download/v#{version}/rookbot-linux-x86_64.tar.gz"
                sha256 "SHA_LINUX_X86_PLACEHOLDER"
              end
            end

            def install
              bin.install "rookbot"
              bin.install "rookbot-daemon"
            end

            def post_install
              system bin/"rookbot", "init"
            end

            test do
              assert_match "rookbot", shell_output("#{bin}/rookbot version")
            end
          end
          FORMULA

          cd tap
          sed -i "s/VERSION_PLACEHOLDER/${RELEASE_VERSION}/" Formula/rookbot.rb
          sed -i "s/SHA_MACOS_PLACEHOLDER/${SHA_MACOS}/" Formula/rookbot.rb
          sed -i "s/SHA_LINUX_X86_PLACEHOLDER/${SHA_LINUX_X86}/" Formula/rookbot.rb
          sed -i "s/SHA_LINUX_ARM_PLACEHOLDER/${SHA_LINUX_ARM}/" Formula/rookbot.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/rookbot.rb
          git commit -m "Update rookbot to ${RELEASE_VERSION}"
          git push origin main
