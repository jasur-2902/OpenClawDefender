[graph]
targets = []
all-features = false

[advisories]
# Known transitive dependency issues from yara-x 0.12 (wasmtime 26.0.1, rsa 0.9.10).
# These will be resolved when yara-x is upgraded to 1.x.
ignore = [
    "RUSTSEC-2025-0046",
    "RUSTSEC-2025-0118",
    "RUSTSEC-2026-0020",
    "RUSTSEC-2026-0021",
    "RUSTSEC-2026-0085",
    "RUSTSEC-2026-0086",
    "RUSTSEC-2026-0087",
    "RUSTSEC-2026-0088",
    "RUSTSEC-2026-0089",
    "RUSTSEC-2026-0091",
    "RUSTSEC-2026-0092",
    "RUSTSEC-2026-0093",
    "RUSTSEC-2026-0094",
    "RUSTSEC-2026-0095",
    "RUSTSEC-2026-0096",
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0002",
    # Unmaintained transitive deps
    "RUSTSEC-2025-0141", # bincode — via yara-x
    "RUSTSEC-2024-0384", # instant — transitive
    "RUSTSEC-2024-0436", # paste — transitive
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
exceptions = [
    { allow = ["GPL-3.0"], crate = "yara-x" },
]

[[licenses.clarify]]
crate = "mock-eslogger"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "mock-mcp-server"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
